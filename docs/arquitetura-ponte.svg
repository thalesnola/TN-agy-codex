x="535" y="798" font-size="16" fill="#1B1F3B" font-weight="700" text-anchor="start"><tspan x="535" dy="0">opencode-local:</tspan><tspan x="535" dy="21.6">Nemotron 30B · investigação acervo / RAG</tspan></text><text x="535" y="838" font-size="16" fill="#1B1F3B" font-weight="700" text-anchor="start"><tspan x="535" dy="0">ollama-direct:</tspan><tspan x="535" dy="21.6">qwen3-coder:30b · refatoração e quick review</tspan></text><text x="535" y="878" font-size="15" fill="#FF5A6E" font-weight="700" text-anchor="start"><tspan x="535" dy="0">Governança:</tspan><tspan x="535" dy="20.25">Lock serial atômico + unreviewed_local_output: true</tspan></text></g><g filter="url(#sh)"><rect x="50" y="918" width="900" height="90.1" rx="28" fill="#1B1F3B"/></g><text x="500.0" y="961" font-size="23" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">Contrato estrito: dados fluem em JSONL/stdio; o AGY mantém a</tspan><tspan x="500.0" dy="31.05">soberania analítica sobre qualquer diff.</tspan></text>
