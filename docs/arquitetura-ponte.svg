<text x="50" y="85" font-size="42" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="50" dy="0">Arquitetura Técnica da Ponte agy-codex</tspan></text><text x="52" y="125" font-size="24" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Contratos JSON-RPC 2.0, validação por Schema, isolamento de workspace</tspan><tspan x="52" dy="32">e preflight serial</tspan></text><g filter="url(#sh)"><rect x="50" y="203" width="900" height="122" rx="20" fill="#fff" stroke="#7B5CFF" stroke-width="3"/><text x="78" y="245" font-size="23" fill="#7B5CFF" font-weight="800" text-anchor="start"><tspan x="78" dy="0">CLIENTE: GOOGLE ANTIGRAVITY (AGY)</tspan></text><text x="78" y="279" font-size="16.5" fill="#3C4268" font-weight="500" text-anchor="start"><tspan x="78" dy="0">• Cérebro (Gemini 4 Argon / Claude Opus) &amp; Agentes Rápidos (Gemini 3.8 Flash / Claude Sonnet)</tspan></text><text x="78" y="305" font-size="16" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="78" dy="0">• Comunica via stdio JSON-RPC 2.0 com o servidor MCP nativo agy-codex-mcp ou CLI JSON</tspan></text></g><line x1="500" y1="325" x2="500" y2="365" stroke="#1B1F3B" stroke-width="5" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="50" y="375" width="900" height="230" rx="20" fill="#fff" stroke="#1B1F3B" stroke-width="3"/><rect x="50" y="375" width="900" height="42" rx="20" fill="#1B1F3B"/><text x="75" y="403" font-size="19" fill="#fff" font-weight="800" text-anchor="start"><tspan x="75" dy="0">SERVIDOR MCP STDIO &amp; MOTOR DE ROTEAMENTO (agy_codex)</tspan></text><rect x="75" y="435" width="200" height="75" rx="12" fill="#F8FAFC" stroke="#5B6286" stroke-width="1.5"/><text x="87" y="463" font-size="16.5" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="87" dy="0">mcp_server.py</tspan></text><text x="87" y="490" font-size="12.8" fill="#5B6286" font-weight="500" text-anchor="start"><tspan x="87" dy="0">JSON-RPC 2.0 · 7 tools</tspan></text><rect x="290" y="435" width="200" height="75" rx="12" fill="#F8FAFC" stroke="#5B6286" stroke-width="1.5"/><text x="302" y="463" font-size="16.5" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="302" dy="0">router.py</tspan></text><text x="302" y="490" font-size="12.8" fill="#5B6286" font-weight="500" text-anchor="start"><tspan x="302" dy="0">Hierarquia determinística</tspan></text><rect x="505" y="435" width="200" height="75" rx="12" fill="#F8FAFC" stroke="#5B6286" stroke-width="1.5"/><text x="517" y="463" font-size="16.5" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="517" dy="0">discovery.py</tspan></text><text x="517" y="490" font-size="12.8" fill="#5B6286" font-weight="500" text-anchor="start"><tspan x="517" dy="0">Auto-busca WindowsApps/npm</tspan></text><rect x="720" y="435" width="200" height="75" rx="12" fill="#F8FAFC" stroke="#5B6286" stroke-width="1.5"/><text x="732" y="463" font-size="16.5" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="732" dy="0">preflight.py</tspan></text><text x="732" y="490" font-size="12.8" fill="#5B6286" font-weight="500" text-anchor="start"><tspan x="732" dy="0">Workspace &amp; lock serial</tspan></text><text x="75" y="540" font-size="17" fill="#1B1F3B" font-weight="700" text-anchor="start"><tspan x="75" dy="0">Contratos JSON Schemas: task.schema.json  ·  result.schema.json  ·  review.schema.json</tspan></text><text x="75" y="570" font-size="15.5" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="75" dy="0">Locks &amp; Proteções: ~/.agy-codex/ollama-serial.lock  ·  Rejeição de reparse points  ·  Proibição num_gpu=0</tspan></text></g><line x1="280" y1="605" x2="280" y2="645" stroke="#2F9BFF" stroke-width="5" marker-end="url(#ar_blue)"/><line x1="720" y1="605" x2="720" y2="645" stroke="#16C79A" stroke-width="5" marker-end="url(#ar_mint)"/><g filter="url(#sh)"><rect x="50" y="655" width="435" height="318" rx="18" fill="#fff" stroke="#2F9BFF" stroke-width="2.5"/><rect x="50" y="655" width="435" height="38" rx="18" fill="#2F9BFF"/><text x="70" y="681" font-size="17" fill="#fff" font-weight="800" text-anchor="start"><tspan x="70" dy="0">CODEX CLI EXEC RUNNER</tspan></text><text x="70" y="721" font-size="15.5" fill="#1B1F3B" font-weight="700" text-anchor="start"><tspan x="70" dy="0">Binário:</tspan><tspan x="70" dy="20">codex.exe / codex CLI (auto-descoberto)</tspan></text><text x="70" y="771" font-size="15.5" fill="#1B1F3B" font-weight="700" text-anchor="start"><tspan x="70" dy="0">Modelos &amp; Perfis:</tspan><tspan x="70" dy="20">2ª família OpenAI/GPT (sol / luna / default)</tspan></text><text x="70" y="821" font-size="15" fill="#3C4268" font-weight="500" text-anchor="start"><tspan x="70" dy="0">Flags de Isolamento:</tspan><tspan x="70" dy="20">exec -m &lt;model&gt; -s &lt;sandbox&gt; --ephemeral</tspan></text><text x="70" y="871" font-size="15" fill="#3C4268" font-weight="500" text-anchor="start"><tspan x="70" dy="0">Workspace:</tspan><tspan x="70" dy="20">Staging efêmero (agy-codex-ws/) + git diff limpo</tspan></text><text x="70" y="923" font-size="15" fill="#7B5CFF" font-weight="700" text-anchor="start"><tspan x="70" dy="0">Retorno:</tspan><tspan x="70" dy="20">JSON validado por Schema + patch auditável</tspan></text></g><g filter="url(#sh)"><rect x="515" y="655" width="435" height="318" rx="18" fill="#fff" stroke="#16C79A" stroke-width="2.5"/><rect x="515" y="655" width="435" height="38" rx="18" fill="#16C79A"/><text x="535" y="681" font-size="17" fill="#fff" font-weight="800" text-anchor="start"><tspan x="535" dy="0">OLLAMA SERIAL LOCAL RUNNERS</tspan></text><text x="535" y="721" font-size="15.5" fill="#1B1F3B" font-weight="700" text-anchor="start"><tspan x="535" dy="0">dsh-local:</tspan><tspan x="535" dy="20">gpt-oss:20b (~70 s) · código e revisão 1–4 arqs</tspan></text><text x="535" y="771" font-size="15.5" fill="#1B1F3B" font-weight="700" text-anchor="start"><tspan x="535" dy="0">qwen-local:</tspan><tspan x="535" dy="20">Qwen3-Coder-Next 36 GB · lote mecânico ≥ 5 arqs</tspan></text><text x="535" y="821" font-size="15.5" fill="#1B1F3B" font-weight="700" text-anchor="start"><tspan x="535" dy="0">opencode-local:</tspan><tspan x="535" dy="20">Nemotron 30B · consulta estruturada / RAG</tspan></text><text x="535" y="871" font-size="15.5" fill="#1B1F3B" font-weight="700" text-anchor="start"><tspan x="535" dy="0">ollama-direct:</tspan><tspan x="535" dy="20">qwen3-coder:30b / 7b · refatoração rápida</tspan></text><text x="535" y="923" font-size="15" fill="#FF5A6E" font-weight="700" text-anchor="start"><tspan x="535" dy="0">Governança:</tspan><tspan x="535" dy="20">Lock serial atômico + unreviewed_local_output</tspan></text></g><g filter="url(#sh)"><rect x="50" y="997" width="900" height="90.1" rx="28" fill="#1B1F3B"/></g><text x="500.0" y="1040" font-size="23" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">Contrato estrito: dados fluem em JSONL/stdio; o AGY mantém a</tspan><tspan x="500.0" dy="31.05">soberania analítica sobre qualquer diff.</tspan></text>
</svg>