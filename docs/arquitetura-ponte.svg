<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1137" width="1000" height="1137" font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif">
