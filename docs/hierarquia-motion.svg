<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1811" width="1000" height="1811" font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEFF"/><stop offset="0.55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F7FF"/></linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7B5CFF" stop-opacity="0"/><stop offset="1" stop-color="#7B5CFF" stop-opacity="0.2"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1B1F3B" flood-opacity="0.16"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
<marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1B1F3B"/></marker>
<marker id="ar_blue" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#2F9BFF"/></marker>
<marker id="ar_mint" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#16C79A"/></marker>
</defs>
<rect width="1000" height="1811" fill="url(#bg)"/>
<circle cx="930" cy="110" r="160" fill="#FF7AC6" opacity="0.14" filter="url(#glow)"/>
<circle cx="70" cy="1681" r="180" fill="#2F9BFF" opacity="0.13" filter="url(#glow)"/>
<rect x="-60" y="760.62" width="700" height="28" rx="14" fill="url(#trail)" transform="rotate(-12 300 760.62)"/>
<rect x="520" y="1711" width="600" height="24" rx="12" fill="url(#trail)" transform="rotate(-12 800 1711)"/>
<text x="50" y="85" font-size="42" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="50" dy="0">O AGY comanda; o Codex e os modelos</tspan><tspan x="50" dy="52">locais executam</tspan></text><text x="52" y="177" font-size="24" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Hierarquização da ponte agy-codex — segunda família em nuvem e fila</tspan><tspan x="52" dy="32">local a custo zero</tspan></text><g filter="url(#sh)"><rect x="50" y="255" width="900" height="178.95000000000002" rx="24" fill="#fff"/><rect x="50" y="255" width="12" height="178.95000000000002" rx="6" fill="#7B5CFF"/></g><text x="82" y="301.1" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82" dy="0">NÍVEL 1 · IA COMANDANTE: ANTIGRAVITY (AGY)</tspan></text><text x="82" y="339.2" font-size="23" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Cérebro (Gemini 4 Argon → Opus) define a arquitetura; Agentes</tspan><tspan x="82" dy="31.05">Rápidos (Flash 3.8 → Sonnet) fazem leitura ilimitada e acionam a</tspan><tspan x="82" dy="31.05">ponte.</tspan></text><line x1="500" y1="457.95000000000005" x2="500" y2="522.95" stroke="#1B1F3B" stroke-width="6" stroke-dasharray="3 12" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="500" cy="656.95" r="124" fill="#1B1F3B" stroke="#fff" stroke-width="8" filter="url(#sh)"/><text x="500" y="630.95" font-size="22" fill="#fff" font-weight="900" text-anchor="middle"><tspan x="500" dy="0">PONTE</tspan><tspan x="500" dy="28">AGY → OPERÁRIAS</tspan></text><text x="500" y="698.95" font-size="15" fill="#fff" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">MCP stdio · CLI JSON · Preflight</tspan></text><line x1="500" y1="798.95" x2="500" y2="824.95" stroke="#1B1F3B" stroke-width="5" stroke-linecap="round"/><line x1="270" y1="824.95" x2="730" y2="824.95" stroke="#1B1F3B" stroke-width="5" stroke-linecap="round"/><line x1="270" y1="824.95" x2="270" y2="870.95" stroke="#2F9BFF" stroke-width="6" stroke-dasharray="3 11" stroke-linecap="round" marker-end="url(#ar_blue)"/><line x1="730" y1="824.95" x2="730" y2="870.95" stroke="#16C79A" stroke-width="6" stroke-dasharray="3 11" stroke-linecap="round" marker-end="url(#ar_mint)"/><g filter="url(#sh)"><rect x="50" y="888.95" width="440" height="46" rx="23" fill="#2F9BFF"/></g><text x="270.0" y="917.95" font-size="18" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="270.0" dy="0">NÍVEL 2A · CODEX CLI (2ª FAMÍLIA)</tspan></text><g filter="url(#sh)"><rect x="510" y="888.95" width="440" height="46" rx="23" fill="#16C79A"/></g><text x="730.0" y="917.95" font-size="18" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="730.0" dy="0">NÍVEL 2B · OLLAMA SERIAL (LOCAL)</tspan></text><g filter="url(#sh)"><rect x="50" y="952.95" width="440" height="227.8" rx="24" fill="#fff"/><rect x="50" y="952.95" width="12" height="227.8" rx="6" fill="#2F9BFF"/></g><text x="82" y="997.35" font-size="24" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82" dy="0">codex_review &amp;</tspan><tspan x="82" dy="31.200000000000003">codex_challenge</tspan></text><text x="82" y="1064.15" font-size="21" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Auditoria independente de diffs e</tspan><tspan x="82" dy="28.35">estresse de planos em sandbox</tspan><tspan x="82" dy="28.35">read-only por outra família de</tspan><tspan x="82" dy="28.35">IA.</tspan></text><g filter="url(#sh)"><rect x="510" y="952.95" width="440" height="196.60000000000002" rx="24" fill="#fff"/><rect x="510" y="952.95" width="12" height="196.60000000000002" rx="6" fill="#16C79A"/></g><text x="542" y="997.35" font-size="24" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="542" dy="0">dsh-local &amp; ollama-direct</tspan></text><text x="542" y="1032.95" font-size="21" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="542" dy="0">Tarefas de 1 a 4 arquivos</tspan><tspan x="542" dy="28.35">(gpt-oss:20b) e refatorações</tspan><tspan x="542" dy="28.35">rápidas locais sem consumir cota</tspan><tspan x="542" dy="28.35">de nuvem.</tspan></text><g filter="url(#sh)"><rect x="50" y="1198.75" width="440" height="170" rx="24" fill="#fff"/><rect x="50" y="1198.75" width="12" height="170" rx="6" fill="#2F9BFF"/></g><text x="82" y="1243.15" font-size="24" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82" dy="0">codex_delegate &amp; codex_ask</tspan></text><text x="82" y="1278.75" font-size="21" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Execução efêmera em workspace</tspan><tspan x="82" dy="28.35">isolado, devolvendo apenas patch</tspan><tspan x="82" dy="28.35">auditável e síntese JSON.</tspan></text><g filter="url(#sh)"><rect x="510" y="1198.75" width="440" height="196.60000000000002" rx="24" fill="#fff"/><rect x="510" y="1198.75" width="12" height="196.60000000000002" rx="6" fill="#16C79A"/></g><text x="542" y="1243.15" font-size="24" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="542" dy="0">qwen-local &amp; opencode-local</tspan></text><text x="542" y="1278.75" font-size="21" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="542" dy="0">Lotes mecânicos ≥ 5 arquivos num</tspan><tspan x="542" dy="28.35">único prompt (Qwen3-Coder-Next 36</tspan><tspan x="542" dy="28.35">GB) e consulta RAG (Nemotron</tspan><tspan x="542" dy="28.35">30B).</tspan></text><g filter="url(#sh)"><rect x="50" y="1419.35" width="440" height="199.45000000000002" rx="24" fill="#fff"/><rect x="50" y="1419.35" width="12" height="199.45000000000002" rx="6" fill="#FFB300"/></g><text x="82" y="1463.75" font-size="24" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82" dy="0">Guarda de Memória &amp; Fila</tspan><tspan x="82" dy="31.200000000000003">Serial</tspan></text><text x="82" y="1530.55" font-size="21" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Lock exclusivo (NUM_PARALLEL=1) e</tspan><tspan x="82" dy="28.35">descarga automática via ollama ps</tspan><tspan x="82" dy="28.35">impedem colisão de pesos grandes.</tspan></text><g filter="url(#sh)"><rect x="510" y="1419.35" width="440" height="227.8" rx="24" fill="#fff"/><rect x="510" y="1419.35" width="12" height="227.8" rx="6" fill="#FF5A6E"/></g><text x="542" y="1463.75" font-size="24" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="542" dy="0">Conferência Obrigatória no</tspan><tspan x="542" dy="31.200000000000003">Retorno</tspan></text><text x="542" y="1530.55" font-size="21" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="542" dy="0">Todo resultado operário volta</tspan><tspan x="542" dy="28.35">validado por JSON Schema e passa</tspan><tspan x="542" dy="28.35">pelo crivo do AGY antes de</tspan><tspan x="542" dy="28.35">integrar.</tspan></text><g filter="url(#sh)"><rect x="50" y="1671.1499999999999" width="900" height="90.1" rx="28" fill="#1B1F3B"/></g><text x="500.0" y="1714.1499999999999" font-size="23" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">Hierarquia clara: o AGY pensa e valida; o Codex audita em 2ª</tspan><tspan x="500.0" dy="31.05">família; o hardware local absorve o volume.</tspan></text>
</svg>