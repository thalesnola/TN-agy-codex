  <rect x="680" y="440" width="260" height="24" rx="12" fill="url(#trail_blue)" transform="rotate(-12 810 452)"/>
  <rect x="60" y="36" width="354.0" height="26" rx="13" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1"/>
  <text x="237.0" y="53" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.5">INTEGRAÇÃO ENTRE IAS · ARQUITETURA BIFURCADA</text><text x="60" y="86" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#1B1F3B">TN-agy-codex · Ponte AGY → Codex & Modelos Locais</text><text x="60" y="114" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#4A5568">Antigravity comanda o OpenAI Codex CLI e executores locais Ollama com preflight e fila serial.</text>
  <rect x="282" y="158" width="440" height="75" rx="18" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="281" y="154" width="440" height="75" rx="18" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="280" y="150" width="440" height="75" rx="18" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5"/><rect x="300" y="162" width="130" height="20" rx="10" fill="#EDE9FE"/><text x="365" y="176" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#7C3AED" text-anchor="middle">IA COMANDANTE</text><text x="445" y="177" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Google Antigravity (Argon)</text><text x="300" y="206" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#E9D5FF">Define o plano, arbitra contratos JSON e audita as entregas finais.</text>
