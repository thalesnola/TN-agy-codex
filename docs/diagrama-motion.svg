  <text x="125" y="848" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">O melhor de cada plataforma com validação mútua, respeito rigoroso de hardware e segurança operacional.</text>
