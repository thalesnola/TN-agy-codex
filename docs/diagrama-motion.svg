  <text x="96" y="675" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="96" dy="0">AGY finaliza implementação e</tspan><tspan x="96" dy="16">solicita revisão imparcial e lote de</tspan><tspan x="96" dy="16">testes em subpasta isolada.</tspan></text>
  
