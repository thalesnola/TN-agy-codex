  <rect x="80" y="340" width="390" height="135" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/><rect x="96" y="352" width="130" height="20" rx="10" fill="#E0F2FE"/><text x="161" y="366" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#0284C7" text-anchor="middle">2ª FAMÍLIA (NUVEM)</text><text x="96" y="392" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">OpenAI Codex CLI (codex.exe)</text><text x="96" y="412" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="96" dy="0">• Resolução nativa de binário no WindowsApps</tspan><tspan x="96" dy="17">• Workspace isolado (branch temporária agy-codex-ws)</tspan><tspan x="96" dy="17">• Revisão independente de bugs e vulnerabilidades</tspan></text>
  <rect x="532" y="348" width="390" height="135" rx="16" fill="#1B1F3B" fill-opacity="0.06"/>
  <rect x="531" y="344" width="390" height="135" rx="16" fill="#1B1F3B" fill-opacity="0.05"/>
  <rect x="530" y="340" width="390" height="135" rx="16" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5"/><rect x="546" y="352" width="130" height="20" rx="10" fill="#FFEDD5"/><text x="611" y="366" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#D97706" text-anchor="middle">FILA SERIAL (LOCAL)</text><text x="546" y="392" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1B1F3B">Modelos Ollama sob Mutex Estrito</text><text x="546" y="412" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="546" dy="0">• Fila serial obrigatória (OLLAMA_NUM_PARALLEL=1)</tspan><tspan x="546" dy="17">• qwen-local (lotes ≥ 5 arquivos) e dsh-local (1-4 arquivos)</tspan><tspan x="546" dy="17">• Preflight de hardware (RAM &gt; 12 GB, VRAM livre)</tspan></text>
