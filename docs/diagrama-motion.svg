  <rect x="330" y="255" width="340" height="50" rx="14" fill="#1B1F3B" stroke="#334155" stroke-width="1.5"/><text x="500" y="278" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#60A5FA" text-anchor="middle">PONTE MCP STDIO + CLI agy-codex</text><text x="500" y="294" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">Contratos JSON Schema · Isolamento de Workspace · Mutex Serial</text><line x1="500" y1="225" x2="500" y2="255" stroke="#7C3AED" stroke-width="2"/><line x1="420" y1="305" x2="270" y2="340" stroke="#0284C7" stroke-width="2"/><line x1="580" y1="305" x2="730" y2="340" stroke="#D97706" stroke-width="2"/>
  <rect x="82" y="348" width="390" height="135" rx="16" fill="#1B1F3B" fill-opacity="0.06"/>
